
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mercy House Cup</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .glass-vial {
      background: linear-gradient(
        90deg,
        rgba(255,255,255,.28),
        rgba(255,255,255,.04) 18%,
        rgba(255,255,255,.02) 55%,
        rgba(255,255,255,.18)
      );
      box-shadow:
        inset 8px 0 14px rgba(255,255,255,.22),
        inset -10px 0 18px rgba(0,0,0,.55),
        0 0 22px rgba(255,255,255,.18);
    }

    .sparkle {
      background-image:
        radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 2px);
      background-size: 14px 14px;
      animation: shimmer 4s linear infinite;
    }

    @keyframes shimmer {
      from { background-position: 0 0; }
      to { background-position: 30px -80px; }
    }

    .magic-burst {
      animation: magicBurst 2s ease-out;
    }

    @keyframes magicBurst {
      0% { transform: scale(1); filter: brightness(1); }
      35% { transform: scale(1.15); filter: brightness(2); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    .magic-flash::after {
      content: "+ POINTS";
      position: absolute;
      left: 50%;
      top: 34%;
      transform: translateX(-50%);
      color: gold;
      font-size: 2.4rem;
      font-weight: 900;
      white-space: nowrap;
      text-shadow:
        0 0 15px gold,
        0 0 35px rgba(255,215,0,.9);
      animation: floatPoints 2s ease-out forwards;
      pointer-events: none;
      z-index: 100;
    }

    @keyframes floatPoints {
      0% {
        opacity: 0;
        transform: translate(-50%, 30px) scale(.6);
      }
      25% {
        opacity: 1;
        transform: translate(-50%, 0) scale(1.15);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -110px) scale(1);
      }
    }

    /* Liquid stays within the glass vial */
    .liquid-area {
      position: absolute;
      bottom: 16px;
      left: 12px;
      right: 12px;
      height: 380px;
      overflow: hidden;
      border-radius: 0 0 999px 999px;
    }

    .liquid-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 0%;
      transition: height 1.4s ease-in-out;
      border-radius: 0 0 999px 999px;
    }
  </style>
</head>

<script>
const CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vT20L0oBN9KBmE6lxzRaCDKDGf69ViN4yVQeevVIJp3g3iLR1iR8pHCDfTKH3gExqIX8xtSPCtX__TT/pub?gid=1573990268&single=true&output=csv";

const HOUSE_NAMES = [
  "Bradán",
  "Broc",
  "Iolar",
  "Giorria",
  "Cú Faoil",
  "Sionnach",
  "Eilc"
];

let previousTotals = {};
let firstLoad = true;
let loading = false;

// Pick a common scale that leaves room above the leader.
function calculateScale(totals) {
  const highest = Math.max(
    0,
    ...HOUSE_NAMES.map(name => totals[name] || 0)
  );

  // Keep the leading vial at approximately 80% or less.
  const needed = Math.max(50, highest / 0.8);

  let step;
  if (needed <= 250) {
    step = 25;
  } else if (needed <= 1000) {
    step = 100;
  } else if (needed <= 5000) {
    step = 250;
  } else {
    step = 1000;
  }

  return Math.ceil(needed / step) * step;
}

async function loadHouseTotals() {
  if (loading) return;
  loading = true;

  try {
    const response = await fetch(
      CSV_URL + "&cacheBust=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("Google Sheets returned " + response.status);
    }

    const csvText = await response.text();
    const rows = csvText.trim().split(/\r?\n/).slice(1);
    const totals = {};

    rows.forEach(row => {
      const columns = row.split(",");
      if (columns.length < 2) return;

      const houseName = columns[0]
        .replace(/^"|"$/g, "")
        .trim()
        .normalize("NFC");

      const points = Number(
        columns[1].replace(/"/g, "").trim()
      );

      if (
        HOUSE_NAMES.includes(houseName) &&
        Number.isFinite(points) &&
        points >= 0
      ) {
        totals[houseName] = points;
      }
    });

    // Avoid clearing the screen if Google sends bad data.
    if (Object.keys(totals).length !== HOUSE_NAMES.length) {
      throw new Error("Incomplete house totals received");
    }

    const scale = calculateScale(totals);
    const houses = document.querySelectorAll(".house");

    houses.forEach(house => {
      const name = house.dataset.house;
      const points = totals[name];
      const oldPoints = previousTotals[name] ?? points;

      // All vials share the same scale.
      // 100% is the safe interior height, not the glass height.
      const percent = points === 0
        ? 0
        : Math.max(6, Math.min((points / scale) * 100, 90));

      house.querySelectorAll(".fill").forEach(fill => {
        fill.style.height = percent + "%";
      });

      house.querySelector(".score").textContent = points;

      // Preserve the existing magical celebration.
      if (!firstLoad && points > oldPoints) {
        house.classList.remove("magic-burst", "magic-flash");
        void house.offsetWidth;
        house.classList.add("magic-burst", "magic-flash");

        setTimeout(() => {
          house.classList.remove("magic-burst", "magic-flash");
        }, 2000);
      }
    });

    previousTotals = { ...totals };
    firstLoad = false;

  } catch (error) {
    console.error("Could not load house totals:", error);
  } finally {
    loading = false;
  }
}

loadHouseTotals();

// Check for new points every 3 seconds.
setInterval(loadHouseTotals, 3000);
</script>
